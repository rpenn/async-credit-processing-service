[project]
name = "credit-service"
version = "0.1.0"
description = "Asynchronous credit processing: FastAPI, RabbitMQ, Celery, MongoDB."
authors = [
    { email = "ryanpenn00@gmail.com" }
]
# Celery 5.6 officially supports CPython up to 3.13.
requires-python = "==3.13.*"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "ASYNC",    # blocking calls in async code
    "SIM",      # simplifications
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]  # so a plain `mypy` checks everything, from local source

[tool.pytest.ini_options]
testpaths = ["tests"]
# Chaos tests start their own Compose stack and take minutes: run them with `-m chaos`.
addopts = ["--strict-markers", "--strict-config", "-m", "not chaos"]
markers = ["chaos: injects real failures into a Compose stack (tests/chaos)"]
filterwarnings = ["error"]  # surface deprecations early instead of ignoring them
