# Full local stack: `docker compose up --build`.
# Requires a .env file (cp .env.example .env).
# Host ports bind to 127.0.0.1 only; MongoDB and AMQP are not exposed to the host at all.

x-app: &app
  build: .
  image: credit-service:local
  restart: unless-stopped
  environment:
    MONGO_URI: mongodb://mongo:27017/credit_service?replicaSet=rs0
    BROKER_URL: amqp://${RABBITMQ_USER:?set in .env}:${RABBITMQ_PASSWORD:?set in .env}@rabbitmq:5672//
    # Largest amount one credit may have. Same default as settings.py.
    MAX_CREDIT_AMOUNT: ${MAX_CREDIT_AMOUNT:-1000000.00}
  depends_on:
    mongo:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  mongo:
    image: mongo:8.0.34
    # Transactions need a replica set; a single node is enough locally.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Local-only, for MongoDB Compass or mongosh. No auth, so never bind beyond 127.0.0.1.
    # Connect with ?directConnection=true: the replica set member is named "mongo".
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Healthy once the replica set has a primary. Initiates the set on first boot.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          if (!db.hello().isWritablePrimary) { quit(1) }
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.7-management
    # The node name (and its data directory) is derived from the hostname, so pin it.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      # Healthy once the node accepts connections and the topology in definitions.json (the
      # dead-letter queue and the policy on the task queue) is loaded. It is imported here,
      # not at boot: a boot-time import would skip creating RABBITMQ_DEFAULT_USER.
      # Imported only while the policy is missing, since each import logs several lines.
      # After editing the file, run the import_definitions command below by hand.
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q check_port_connectivity &&
          { rabbitmqctl -q list_policies | grep -qw credits ||
          rabbitmqctl -q import_definitions /etc/rabbitmq/definitions.json; }
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # The slim image has no curl, so use Python's standard library.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    # Gossip (worker-to-worker event sharing) is unused, and its queue is the same
    # non-durable, non-exclusive kind that RabbitMQ 4.3 refuses.
    command: ["celery", "-A", "credit_service.worker.app", "worker", "--loglevel=INFO", "--without-gossip"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A credit_service.worker.app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  beat:
    <<: *app
    # The schedule state file goes to /tmp because the app user cannot write to /app.
    command:
      - celery
      - -A
      - credit_service.worker.app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule

volumes:
  mongo-data:
  rabbitmq-data:
