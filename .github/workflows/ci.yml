name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Not ubuntu-latest: MongoDB 8.0.34 misreads that runner's kernel version (7.0.0-azure)
    # and refuses to start (SERVER-131779; https://github.com/actions/runner-images/issues/15005).
    # Move back once the tests use MongoDB 8.0.35, which has the fix.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      # Installs Python 3.13 (.python-version) and the locked dependencies.
      - run: uv sync --locked

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

      # Unit and integration tests. The integration tests start MongoDB and RabbitMQ with
      # testcontainers, using the runner's Docker. Chaos tests are excluded by default.
      - run: uv run pytest
